name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: |
          set -o pipefail
          ./gradlew testDevDebugUnitTest -I .github/gradle/skip-known-failures.init.gradle 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # The same key every build is signed with, so each APK installs over the
      # last one and keeps the app's data and sign-in. Without it the runner
      # invents a new key every run and Android refuses the update.
      - name: Use the shared debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/shared-debug.keystore"
            echo "SHARED_KEYSTORE=$RUNNER_TEMP/shared-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, so this APK has a throwaway key."
          fi

      # The benchmark build type: the release build's R8 and non-debuggable
      # runtime, signed with the shared key under the app's own package, so it
      # installs over the last one. A debug build is interpreted and checked at
      # runtime and runs Compose several times slower than the app really does,
      # which made every scroll and launch feel laggier than it is. Release lint
      # is skipped: it stops on translation leftovers in the upstream strings.
      # arm64 only (-Parm64Only): it is the one APK the test builds are tried on.
      - name: Build the dev APK
        run: |
          set -o pipefail
          if [ -n "$SHARED_KEYSTORE" ]; then
            ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark -PnoBenchmarkSuffix -Parm64Only \
              -Pandroid.injected.signing.store.file="$SHARED_KEYSTORE" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          else
            ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark -PnoBenchmarkSuffix -Parm64Only 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          fi

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dial-${{ github.sha }}
          path: app/build/outputs/apk/dev/benchmark/*.apk
          if-no-files-found: error

      # Compiler errors and failed tasks as annotations, so they read on the
      # run's summary without opening the log.
      - name: Report build errors
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            grep -E '^e: |^> Task .*FAILED|What went wrong|Test.*FAILED' "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

