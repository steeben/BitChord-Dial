name: Dev Debug APK

# Builds an installable debug APK for testing changes from a fork or branch.
# No signing secrets needed: debug builds are signed with the debug key, and the
# `dev` flavor installs as "BitChord Dev" beside the normal app.
#
# Run it by hand from the Actions tab (pick the branch), or it runs on every push
# to a fix/** or feat/** branch. The APK is attached to the run as an artifact.
on:
  workflow_dispatch:
  push:
    branches: ['fix/**', 'feat/**']

concurrency:
  group: dev-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build dev debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Android only updates an app in place when the new APK is signed with the
      # same key as the installed one. A fresh CI runner invents a new debug key
      # every run, so each build would have to be uninstalled first, which wipes
      # the app's data, sign-in included. Setting the DEBUG_KEYSTORE_BASE64
      # repository secret makes every build use one key and install over the last.
      - name: Use the shared debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/shared-debug.keystore"
            cp "$RUNNER_TEMP/shared-debug.keystore" ~/.android/debug.keystore
            echo "SHARED_KEYSTORE=$RUNNER_TEMP/shared-debug.keystore" >> "$GITHUB_ENV"
            echo "Using the shared debug signing key."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set, so this build has a throwaway signing key and must be installed over an uninstall."
          fi

      # Last.fm keys are optional; scrobbling is simply inactive without them.
      # When the shared key is present it is passed explicitly, so Gradle cannot
      # fall back to a freshly generated debug key.
      # The benchmark build type: the release build's R8 and non-debuggable
      # runtime, signed with the debug key under its own package. A debug build
      # is interpreted and checked at runtime and runs Compose far slower, which
      # is not what the app feels like to use. Release lint is skipped: it
      # stops on translation leftovers already in the upstream strings, which
      # have nothing to do with whether the build works.
      - name: Build
        # Last.fm's API account for this build; app/build.gradle.kts reads these
        # from the environment. Unset, the login sheet asks for the user's own.
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          if [ -n "$SHARED_KEYSTORE" ]; then
            ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark -PnoBenchmarkSuffix \
              -Pandroid.injected.signing.store.file="$SHARED_KEYSTORE" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          else
            ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark -PnoBenchmarkSuffix
          fi

      # The certificate fingerprint must be identical on every run, or Android
      # will refuse to install over the previous build.
      - name: Show signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/dev/benchmark/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-256' | head -n1)
          echo "$FP"
          {
            echo "### Signing certificate"
            echo '`'"$FP"'`'
            if [ -n "$SHARED_KEYSTORE" ]; then echo "Shared key: yes"; else echo "Shared key: NO (throwaway key)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark-${{ github.sha }}
          path: app/build/outputs/apk/dev/benchmark/*.apk
          if-no-files-found: error

  tests:
    name: Shared unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest
