name: Release

# Pushing a tag like v1.0.0 builds the APK and publishes it as a GitHub release,
# which is what the in-app update check and ObtainX both read. So does a push
# to main that changes RELEASE_NOTES.md: the release is then tagged v<versionName>
# (from app/build.gradle.kts) at that commit, unless that release already exists.
on:
  push:
    tags: ['v*', '[0-9]*']
    branches: [main]
    paths: ['RELEASE_NOTES.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. 1.0.0 or v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Work out the tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
            TAG="v${VERSION}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; nothing to do."
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        if: env.SKIP != '1'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - if: env.SKIP != '1'
        uses: gradle/actions/setup-gradle@v4

      - if: env.SKIP != '1'
        run: chmod +x gradlew

      # Same shared key as the test builds, so a release installs over them.
      - name: Use the shared signing key
        if: env.SKIP != '1'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/shared-debug.keystore"
            cp "$RUNNER_TEMP/shared-debug.keystore" ~/.android/debug.keystore
            echo "SHARED_KEYSTORE=$RUNNER_TEMP/shared-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set; a release signed with a throwaway key could not be updated in place."
            exit 1
          fi

      - name: Build
        if: env.SKIP != '1'
        # Last.fm's API account for this build; app/build.gradle.kts reads these
        # from the environment. Unset, the login sheet asks for the user's own.
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          SIGN=(-Pandroid.injected.signing.store.file="$SHARED_KEYSTORE"
            -Pandroid.injected.signing.store.password=android
            -Pandroid.injected.signing.key.alias=androiddebugkey
            -Pandroid.injected.signing.key.password=android)
          # The bridge first: the same app under the old package
          # (com.steeben.bitchord), so an old install updates in place and
          # hands its data to the new app. See AppMove and ReleaseAssets.
          ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark -PnoBenchmarkSuffix -PoldPackage "${SIGN[@]}"
          cp "$(ls app/build/outputs/apk/dev/benchmark/*.apk | head -n1)" "Dial-${TAG}-bridge.apk"
          rm -rf app/build/outputs/apk/dev/benchmark
          ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark -PnoBenchmarkSuffix "${SIGN[@]}"
          cp "$(ls app/build/outputs/apk/dev/benchmark/*.apk | head -n1)" "Dial-${TAG}.apk"

      - name: Publish release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # The bridge is uploaded first, and its name sorts first too: 1.4.1 and
        # older take a release's first .apk, and that has to be the bridge.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Dial-${TAG}-bridge.apk" --clobber
            gh release upload "$TAG" "Dial-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "Dial-${TAG}-bridge.apk" \
              --target "$GITHUB_SHA" \
              --title "Dial ${TAG#v}" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "Dial-${TAG}.apk"
          fi
